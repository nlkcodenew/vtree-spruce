name: Build App Folder

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download per-platform tarballs from beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          mkdir -p dl
          cd dl
          for asset in vtree-aarch64.tar.gz vtree-a30.tar.gz vtree-mini.tar.gz; do
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "$asset" \
              --clobber
          done
          ls -la

      - name: Assemble FileManagement App folder
        run: |
          set -e
          mkdir -p stage/vtree_extract/{aarch64,a30,mini}
          tar xzf dl/vtree-aarch64.tar.gz -C stage/vtree_extract/aarch64
          tar xzf dl/vtree-a30.tar.gz     -C stage/vtree_extract/a30
          tar xzf dl/vtree-mini.tar.gz    -C stage/vtree_extract/mini

          APP=stage/FileManagement
          mkdir -p "$APP"

          # Shared upstream assets — take from aarch64 (identical across targets)
          cp -r stage/vtree_extract/aarch64/res    "$APP/"
          cp -r stage/vtree_extract/aarch64/fonts  "$APP/"
          cp -r stage/vtree_extract/aarch64/lang   "$APP/"
          cp -r stage/vtree_extract/aarch64/theme  "$APP/"
          cp stage/vtree_extract/aarch64/mux_lang.ini "$APP/"
          cp stage/vtree_extract/aarch64/LICENSE      "$APP/"

          # Spruce-specific app assets (override upstream defaults)
          cp app/launch.sh    "$APP/"
          cp app/config.json  "$APP/"
          cp app/config.ini   "$APP/"
          cp app/file.png     "$APP/"
          cp app/background.png "$APP/"
          chmod +x "$APP/launch.sh"

          # Extra fonts shipped with the spruce build — merged with upstream fonts/
          if [ -d app/fonts ]; then
            cp -v app/fonts/. "$APP/fonts/" -r
          fi

          # Per-platform binaries
          cp stage/vtree_extract/aarch64/vtree "$APP/vtree.aarch64"
          cp stage/vtree_extract/a30/vtree     "$APP/vtree.a30"
          cp stage/vtree_extract/mini/vtree    "$APP/vtree.mini"
          chmod +x "$APP"/vtree.*

          # A30 needs libSDL2_ttf + libSDL2_image (device rootfs doesn't ship them)
          mkdir -p "$APP/lib-A30"
          cp -L stage/vtree_extract/a30/libs/libSDL2_ttf-2.0.so.0   "$APP/lib-A30/"
          cp -L stage/vtree_extract/a30/libs/libSDL2_image-2.0.so.0 "$APP/lib-A30/"
          # (no lib-Brick/SmartPro/SmartProS/Flip/MiyooMini — those devices
          #  already ship the full SDL2 stack in a system path.)

          # Static 7zz (aarch64) — archive extractor used by the vTree
          # "Extract" menu (looked up at <exe_dir>/bin/7zz).
          mkdir -p "$APP/bin"
          cp app/bin/7zz "$APP/bin/7zz"
          chmod +x "$APP/bin/7zz"

          # OTA silent auto-update script (started in background by launch.sh)
          cp app/ota-update.sh "$APP/"
          chmod +x "$APP/ota-update.sh"

          # CA bundle cho may khong co CA he thong (TrimUI stock OS de
          # /etc/ssl/certs trong) - ota-update.sh dung qua CURL_CA_BUNDLE
          # / wget --ca-certificate.
          mkdir -p "$APP/certs"
          cp app/certs/cacert.pem "$APP/certs/"

          # VERSION file — read by ota-update.sh to decide if an update is needed.
          # Tag builds (vX.Y.Z) record X.Y.Z; branch builds get a 0.0.0-beta
          # marker that always sorts below any real release (ota-update.sh
          # compares version components numerically, ignoring suffixes).
          # NOTE: this is the APP release version, not the upstream vtree_version
          # input (v1.1) — deriving it from the git tag is the robust source.
          APP_VERSION="0.0.0-beta+${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            APP_VERSION="${{ github.ref_name }}"
            APP_VERSION="${APP_VERSION#v}"
          fi
          printf '%s\n' "$APP_VERSION" > "$APP/VERSION"
          echo "APP_VERSION=$APP_VERSION"

          echo "=== Final App folder contents ==="
          find "$APP" -maxdepth 2 | sort

      - name: Create FileManagement.zip
        run: |
          cd stage
          zip -r ../FileManagement.zip FileManagement
          cd ..
          ls -la FileManagement.zip
          unzip -l FileManagement.zip | head -30

      - name: Upload to beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "beta-${{ github.ref_name }}" FileManagement.zip --clobber
