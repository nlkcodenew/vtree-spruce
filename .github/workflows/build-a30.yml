name: Build vTree (A30)

on:
  workflow_dispatch:
    inputs:
      vtree_version:
        description: 'vTree version/tag/commit'
        default: 'v1.4.3'
  workflow_call:
    inputs:
      vtree_version:
        type: string
        default: 'v1.4.3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "vTree binaries built from ${{ github.ref_name }}" \
            || true

      - name: Download A30 toolchain
        run: |
          wget -q -O a30_toolchain-v1.0.tar.gz \
            "https://github.com/steward-fu/website/releases/download/miyoo-a30/a30_toolchain-v1.0.tar.gz"

      - name: Build Docker image
        run: docker build -f Dockerfile.a30 -t vtree-builder-a30 .

      - name: Build vTree
        run: |
          mkdir -p output
          docker run --rm \
            -e VTREE_VERSION=${{ inputs.vtree_version || 'v1.4.3' }} \
            -v ${{ github.workspace }}/output:/output \
            vtree-builder-a30

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          tar czf ../vtree-a30.tar.gz .
          cd ..
          gh release upload "beta-${{ github.ref_name }}" vtree-a30.tar.gz --clobber
