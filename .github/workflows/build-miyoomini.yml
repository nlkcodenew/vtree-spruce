name: Build vTree (Miyoo Mini)

on:
  workflow_dispatch:
    inputs:
      vtree_version:
        description: 'vTree version/tag/commit'
        default: 'v1.4.3'
      spruce_ref:
        description: 'spruceOS ref to pull Mini SDL2 libs from'
        default: 'main'
  workflow_call:
    inputs:
      vtree_version:
        type: string
        default: 'v1.4.3'
      spruce_ref:
        type: string
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "vTree binaries built from ${{ github.ref_name }}" \
            || true

      - name: Fetch Miyoo Mini SDL2 libs from spruceOS
        run: |
          REF="${{ inputs.spruce_ref || 'main' }}"
          mkdir -p miyoo_libs
          for lib in libSDL2-2.0.so.0 libSDL2_ttf-2.0.so.0 libSDL2_image-2.0.so.0; do
            echo "Fetching $lib from spruceUI/spruceOS@$REF"
            curl -fL \
              "https://raw.githubusercontent.com/spruceUI/spruceOS/$REF/spruce/miyoomini/lib/$lib" \
              -o "miyoo_libs/$lib"
          done
          ls -la miyoo_libs/

      - name: Build Docker image
        run: docker build -f Dockerfile.miyoomini -t vtree-builder-miyoomini .

      - name: Build vTree
        run: |
          mkdir -p output
          docker run --rm \
            -e VTREE_VERSION=${{ inputs.vtree_version || 'v1.4.3' }} \
            -v ${{ github.workspace }}/output:/output \
            vtree-builder-miyoomini

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          tar czf ../vtree-mini.tar.gz .
          cd ..
          gh release upload "beta-${{ github.ref_name }}" vtree-mini.tar.gz --clobber
